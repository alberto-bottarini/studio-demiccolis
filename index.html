  <title>Studio De Miccolis Angelini – Dottore Commercialista – Rho (MI)</title>
  <meta name="description" content="Studio di consulenza tributaria, societaria e del lavoro a Rho (MI). Dottore Commercialista e Revisore Contabile con oltre 15 anni di esperienza." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #0e1c36;
      --navy-mid:  #152a50;
      --navy-light:#1e3a6e;
      --gold:      #b8973a;
      --gold-light:#d4af57;
      --white:     #ffffff;
      --off-white: #f0f4f8;
      --grey:      #8a9ab5;
      --text:      #d8e2f0;
      --radius:    6px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--text);
      line-height: 1.7;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(14, 28, 54, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(184,151,58,0.25);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      font-family: 'Georgia', serif;
      font-size: 1rem;
      font-weight: bold;
      color: var(--white);
      text-decoration: none;
      letter-spacing: 0.03em;
    }

    .nav-brand span { color: var(--gold-light); }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      color: var(--grey);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--gold-light); }

    .hero-rule {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 1.8rem;
    }

    .hero-eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 500;
      color: var(--gold-light);
      margin-bottom: 1.2rem;
    }

    .hero-title {
      font-family: 'Georgia', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: normal;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .hero-title em {
      font-style: normal;
      color: var(--gold-light);
    }

    .hero-subtitle {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(216,226,240,0.85);
      margin-top: 1.2rem;
      margin-bottom: 2.8rem;
      max-width: 520px;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: var(--radius);
      transition: background 0.25s, color 0.25s;
    }
